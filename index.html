<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everyride · Operations Dashboard</title>
<meta name="description" content="Everyride Car Rental Services — internal operations dashboard">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#112406">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="brand" href="#/overview" aria-label="Everyride home">
      <img src="assets/logo.png" alt="" width="34" height="34">
      <span>Everyride<small>Operations</small></span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#/overview" data-route="overview">Overview</a>
      <a href="#/bookings" data-route="bookings">Bookings</a>
      <a href="#/calendar" data-route="calendar">Calendar</a>
      <a href="#/fleet" data-route="fleet">Fleet</a>
      <a href="#/customers" data-route="customers">Customers</a>
      <a href="#/finance" data-route="finance">Finance</a>
    </nav>
    <div class="nav-actions">
      <button class="btn ghost icon" data-action="open-data" title="Data &amp; backup" aria-label="Data and backup">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
      </button>
      <button class="btn primary" data-action="new-booking">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New booking</span>
      </button>
    </div>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="foot">
  <span>© <span id="yr"></span> Everyride Car Rental Services</span>
  <span>Internal use only · Data is saved in this browser</span>
</footer>

<!-- Dialog host -->
<dialog id="dlg"></dialog>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
